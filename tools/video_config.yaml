# ─────────────────────────────────────────────────────────────────────────────
# TAE Synthetic Video Config  —  video_config.yaml
#
# Usage:
#   python generate_synthetic_video.py --config video_config.yaml
#
# All CLI flags (--altitude, --fps, etc.) still work and override this file.
# ─────────────────────────────────────────────────────────────────────────────


# ── Satellite / aerial base image ─────────────────────────────────────────────
image: data/raw/Lbn/lbn.png
# Geo bounds: omit if a .pgw world file sits alongside the image, or GeoTIFF.
# bounds: "31.230,34.560,31.250,34.590"    # lat_min,lon_min,lat_max,lon_max


# ── Flight simulation ─────────────────────────────────────────────────────────
altitude:  150          # AGL metres
speed:     8.0         # drone speed m/s
pattern:   straight   # boustrophedon | straight
overlap:   30          # lane overlap %


# ── Output video ──────────────────────────────────────────────────────────────
fps:    2
width:  1920
height: 1080
output: output/tracking_test


# ── Camera (DJI Mini 2 defaults) ─────────────────────────────────────────────
sensor_w: 6.3    # sensor width mm
sensor_h: 4.7    # sensor height mm
focal:    4.5    # focal length mm


# ── Static objects baked into terrain ─────────────────────────────────────────
# Format: "lat,lon,color[,radius_m];..."
# static_objects: "31.240,34.570,red,3;31.235,34.580,blue,2"


# ── Frame extraction (for TAE ingest) ─────────────────────────────────────────
extract_frames: true


# ── Tracking targets ───────────────────────────────────────────────────────────
# Each entry plants a PNG object that moves through geo-space over a window of
# frames.  The object appears in the video wherever the camera footprint
# overlaps its current geo-position — a natural tracking test subject.
#
# Sizing priority:
#   real_size_m  →  geo-correct sizing using GSD (recommended)
#   scale        →  fallback: fraction of the video short-edge
#
# trajectory.direction_deg:
#   number → fixed bearing (degrees CW from North, 0=N 90=E 180=S 270=W)
#   null   → random direction, seeded deterministically per target
#
tracking_targets:

  # ── Vehicle moving NE across the survey area ──────────────────────────────
  - id: cow
    png: data/assets/Cow_from_above.png       # PNG with alpha channel (transparent background)
    real_size_m: 2.0              # car body ≈ 4.5 m wide → GSD-correct pixel size
    start_frame: 100               # appears at frame 60 (t=2 s at 30fps)
    end_frame:   120              # disappears at frame 450 (t=15 s)
    trajectory:
      type:          linear
      direction_deg: 47           # roughly NE
      speed_ms:      0.1          # 

  # ── Pedestrian wandering, random direction ────────────────────────────────
  - id: horse
    png: data/assets/Horse_from_above.png
    real_size_m: 1.5              # shoulder width ≈ 0.5 m
    start_frame: 200
    end_frame:   220
    trajectory:
      type:          linear
      direction_deg: null         # random bearing, seeded from target index
      speed_ms:      1.4          # ≈ 5 km/h walking speed

  # ── Fast-moving object (motorcycle-sized), fixed direction ────────────────
  #- id: motorbike_1
  #  png: assets/motorbike_top.png
  #  real_size_m: 2.0
  #  start_frame: 200
  #  end_frame:   400
  #  start_lat:  31.2330
  #  start_lon:  34.5700
  #  trajectory:
  #    type:          linear
  #    direction_deg: 270          # due West
  #    speed_ms:      15.0         # ≈ 54 km/h

  # ── Example using scale instead of real_size_m ───────────────────────────
  # - id: unknown_object
  #   png: assets/blob.png
  #   scale: 0.03                 # 3% of the video short-edge (1080px → ~32px)
  #   start_frame: 0
  #   end_frame:   900
  #   start_lat:  31.2360
  #   start_lon:  34.5660
  #   trajectory:
  #     type:          linear
  #     direction_deg: 135        # SE
  #     speed_ms:      5.0


# ─────────────────────────────────────────────────────────────────────────────
# Ground-truth output
# ─────────────────────────────────────────────────────────────────────────────
# tracking_ground_truth.json is always written if any target is visible.
# Schema:
# {
#   "fps": 30,
#   "total_frames": N,
#   "video_w": 1920, "video_h": 1080,
#   "targets": {
#     "vehicle_1": {
#       "start_frame": 60, "end_frame": 450,
#       "start_lat": 31.232, "start_lon": 34.565,
#       "speed_ms": 8.3, "real_size_m": 4.5,
#       "frames": {
#         "72": {"active":true,"visible":true,"lat":...,"lon":...,"pixel_cx":...,"pixel_cy":...,"obj_w_px":...,"obj_h_px":...},
#         ...
#       }
#     }
#   }
# }
