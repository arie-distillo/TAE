# ─────────────────────────────────────────────────────────────────────────────
# TAE Synthetic Video Config  —  minimal edition
#
# Usage (from project root):
#   python tools/generate_synthetic_video.py --config tools/video_config.yaml
#
# Required:   image, altitude, tracking_targets[].png + real_size_m + speed_ms
# Everything else is auto-derived from altitude + camera model.
# ─────────────────────────────────────────────────────────────────────────────

image:    data/assets/terrain_1.jpg     # any JPEG/PNG; .pgw world file auto-detected
altitude: 80                        # AGL metres  (the only flight parameter you must set)

# ── Synthetic geo-centre (ignored if the image has a .pgw world file) ─────────
# The tool invents self-consistent coordinates so TAE's spatial pipeline works.
# Absolute position is arbitrary — leave as-is for pure tracker testing.
# center_lat: 32.0    ← default
# center_lon: 35.0    ← default

# ── Camera (DJI Mini 2 defaults — change only if using a different drone) ─────
# sensor_w: 6.3
# sensor_h: 4.7
# focal:    4.5

# ── Auto-derived (leave commented unless you want to override) ─────────────────
speed:   1.5        # m/s — auto: cross full footprint in 20 s
fps:     10         # auto
pattern: straight   # auto: one clean pass, ideal for tracking tests
overlap: 0          # auto

# ── Output ────────────────────────────────────────────────────────────────────
output:         output/tracking_test
extract_frames: true

# Telemetry output format.
# srt:      DJI Format-B .SRT sidecar alongside the .MP4 (default, always compatible)
# embedded: dvtm_wm265e.proto packets in a djmd data track inside the .MP4.
#           No .SRT file is produced. Tests DJIProtobufParser end-to-end.
telemetry_format: embedded

# Whether to trim the output video to the visibility window of the tracking targets,
# plus some padding on each side. This is useful for testing on short clips.
clip_to_targets: true
clip_padding_sec: 3.0          # 3 s of context before/after the target appears

# ── Tracking targets ──────────────────────────────────────────────────────────
# Required per target:  png, real_size_m, speed_ms
# Optional:             id, direction_deg, start_frame, end_frame,
#                       start_lat, start_lon  (all auto if omitted)
#
tracking_targets:

  - id:          yellow_car
    png:         data/assets/yellow_car.png
    real_size_m: 4.0        # physical size → geo-correct pixel footprint via GSD
    speed_ms:    2.0       # object speed in m/s

  - id:          orange_car
    png:         data/assets/orange_car.png
    real_size_m: 6.0
    speed_ms:    2.0
    direction_deg: 270      # optional: fix bearing (West); omit for random